# === Управление и горячие клавиши ===
unbind r
bind r source-file ~/.tmux.conf \; display "Конфиг перезагружен!"

# Меняем префикс на Ctrl + Space
set -g prefix C-space
unbind C-b
bind C-space send-prefix

set -g mouse on
set -g history-limit 50000

# Нумерация окон и панелей с 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Разделение окон
bind x split-window -v -c "#{pane_current_path}"
bind y split-window -h -c "#{pane_current_path}"

# Навигация в стиле Vim
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Фикс мыши для Wayland: выделяешь, и оно сразу в буфере обмена
setw -g mode-keys vi
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# === Плагины (TPM) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# === Настройки темы Catppuccin Mocha ===
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_default "no"

# Кастомные цвета
set -g @thm_bg "#1e1e2e"
set -g @thm_surface "#313244"
set -g @green "#a6e3a1"
set -g @mauve "#cba6f7"
set -g @red "#f38ba8"
set -g @teal "#94e2d5"
set -g @sky "#89dceb"
set -g @peach "#fab387"
set -g @blue "#89b4fa"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# === Статус-бар ===
set -g status-position bottom
set -g status-style "bg=#{@thm_bg},fg=#a6adc8"
set -g status-left ""
set -g status-right ""

# Левая часть
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#[bg=#{@red}]#[fg=#{@thm_bg}]#[bold]  #S ,#[bg=default]#[fg=#{@mauve}]  #S }"
set -ga status-left "#[bg=default,fg=#313f55] │ "
set -ga status-left "#[bg=default,fg=#{@blue}]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#313f55] │ "
set -ga status-left "#[bg=default,fg=#{@teal}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# Правая часть
set -g status-right-length 100
set -ga status-right "#[bg=default,fg=#{@sky}]  CPU: #{cpu_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_surface}] │ "
set -ga status-right "#[bg=default,fg=#{@mauve}]  RAM: #{ram_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_surface}] │ "
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#[bg=#{@red}]#[fg=#{@thm_bg}],#[bg=default]#[fg=#{@peach}]} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_surface}] │ "
set -ga status-right "#[bg=default,fg=#{@green}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# Оформление вкладок окон
set -g window-status-format "#[fg=#313f55]#[fg=#a4b1cd,bg=#313f55] #I:#W #[fg=#313f55,bg=default]"
set -g window-status-current-format "#[fg=#{@green}]#[fg=#1a2332,bg=#{@green},bold] #I:#W #[fg=#{@green},bg=default]"
set -g window-status-separator " "
set -g status-justify "absolute-centre"

# Автоматическая установка TPM
if "test ! -d ~/.tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
